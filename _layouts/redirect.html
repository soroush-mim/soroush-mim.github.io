<!DOCTYPE html>
{%- assign target = page.redirect_to | default: site.cv_pdf | relative_url -%}
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }} · {{ site.first_name }}</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ target | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ target }}">
  </head>
  <body>
    <p>Redirecting to <a href="{{ target }}">{{ target }}</a>.</p>
  </body>
</html>
