    <footer class="term-footer{% if site.footer_fixed %} fixed-bottom{% else %} sticky-bottom mt-5{% endif %}">
      <div class="container">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.middle_name }} {{ site.last_name }}</span>
        <span>jekyll + al-folio</span>
        <span>built {{ site.time | date: '%Y-%m-%d' }}</span>
        {%- if site.impressum_path %}
        <a href="{{ site.url }}{{ site.baseurl }}{{ site.impressum_path }}">impressum</a>
        {%- endif %}
        {%- if site.footer_text != blank %}
        <span>{{ site.footer_text }}</span>
        {%- endif %}
        <a class="term-footer-top" href="#">cd ~ &uarr;</a>
      </div>
    </footer>
